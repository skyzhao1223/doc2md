[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2md-mcp"
version = "0.2.0"
description = "MCP server that converts PDF, DOCX, PPTX, XLSX, HTML and EPUB documents — from a URL or base64 — into clean Markdown, with table extraction, full-text search and OCR for scanned files. No API key required."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "doc2md maintainers" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "pdf",
  "markdown",
  "docx",
  "pptx",
  "xlsx",
  "ocr",
  "rag",
  "document-conversion",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "mcp>=1.9.0,<2",
  "pymupdf4llm>=0.0.17",
  "markitdown[docx,pptx,xlsx]>=0.1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3.24"]
dev = ["pytest>=8.0", "python-docx>=1.1"]

[project.scripts]
doc2md = "doc2md.server:main"

[project.urls]
Homepage = "https://github.com/skyzhao1223/doc2md"
Repository = "https://github.com/skyzhao1223/doc2md"
Issues = "https://github.com/skyzhao1223/doc2md/issues"
Changelog = "https://github.com/skyzhao1223/doc2md/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
